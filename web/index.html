<!DOCTYPE html>
<html lang="pl">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Grubasek - Nowoczesny licznik kalorii i makroskładników offline z bazą 900+ polskich produktów i chmurą.">
  <meta name="theme-color" content="#8B5CF6">
  <meta name="color-scheme" content="dark">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Grubasek">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-180.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Grubasek - Licznik Kalorii & Makro</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #090A0F;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
  </style>

  <script>
    // PWA beforeinstallprompt capture for in-app installation
    window.deferredInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.deferredInstallPrompt = e;
      window.dispatchEvent(new CustomEvent('pwa-install-ready'));
    });

    // PWA Service Worker auto-update detection
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        console.log('Grubasek PWA: Nowa wersja została zainstalowana.');
      });
    }

    // Hardware torch controller for camera stream on supported browsers
    window.toggleGrubasekTorch = async function(enable) {
      try {
        const videoElements = document.querySelectorAll('video');
        for (const video of videoElements) {
          const stream = video.srcObject;
          if (!stream || !stream.getVideoTracks) continue;
          const tracks = stream.getVideoTracks();
          for (const track of tracks) {
            if (!track.applyConstraints) continue;
            const capabilities = track.getCapabilities ? track.getCapabilities() : {};
            if (capabilities.torch === undefined && !('torch' in capabilities)) {
              continue;
            }
            await track.applyConstraints({
              advanced: [{ torch: Boolean(enable) }]
            });
            return true;
          }
        }
        return false;
      } catch (err) {
        console.warn('Grubasek torch error:', err);
        return false;
      }
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
