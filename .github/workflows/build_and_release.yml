name: Build & Release Grubasek (Android APK & Web PWA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Kompilacja pliku APK (Android)
    runs-on: ubuntu-latest

    steps:
      - name: Pobieranie kodu z repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Java (OpenJDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Konfiguracja Flutter SDK (3.24.5)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Pobieranie zależności projektu
        run: flutter pub get

      - name: Uruchomienie testów jednostkowych
        run: flutter test

      - name: Budowanie pliku Android APK (Release)
        run: flutter build apk --release

      - name: Zmiana nazwy pliku na grubasek.apk
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/grubasek.apk

      - name: Zapisanie pliku instalacyjnego APK jako Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: grubasek-android-apk
          path: build/app/outputs/flutter-apk/grubasek.apk
          retention-days: 30

      - name: Publikacja automatycznego Release w GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Grubasek Najnowsza Wersja (Android APK)"
          body: |
            Automatyczna kompilacja najnowszej wersji aplikacji Grubasek.
            Pobierz plik `grubasek.apk` i zainstaluj na telefonie z systemem Android.
          files: build/app/outputs/flutter-apk/grubasek.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-web:
    name: Kompilacja wersji Web (PWA)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Pobieranie kodu z repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Flutter SDK (3.24.5)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Pobieranie zależności projektu
        run: flutter pub get

      - name: Budowanie wersji Web (PWA Release)
        run: flutter build web --release --base-href /app/ --web-renderer canvaskit --pwa-strategy none

      - name: Zapisanie wersji Web jako Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: grubasek-web-pwa
          path: build/web
          retention-days: 14

      - name: Przygotowanie strony i aplikacji dla Cloudflare Pages
        if: github.ref == 'refs/heads/main'
        run: node deploy/build-pages.mjs build/web build/pages "$GITHUB_SHA"

      - name: Zapisanie paczki Cloudflare Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: grubasek-pages
          path: build/pages
          if-no-files-found: error
          retention-days: 7

  deploy-web:
    name: Publikacja na grubasek.pages.dev
    needs: build-web
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: grubasek-pages-production
      cancel-in-progress: false
    steps:
      - name: Sprawdzenie aktualności wersji
        id: revision
        shell: bash
        run: |
          latest=$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" refs/heads/main | cut -f1)
          test -n "$latest"
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Na main jest już nowszy commit. Pomijam tę publikację."
          fi

      - name: Pobranie gotowej strony
        if: steps.revision.outputs.deploy == 'true'
        uses: actions/download-artifact@v4
        with:
          name: grubasek-pages
          path: pages

      - name: Konfiguracja Node.js
        if: steps.revision.outputs.deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wdrożenie na Cloudflare Pages
        if: steps.revision.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Ustaw CLOUDFLARE_API_TOKEN (sekret) i CLOUDFLARE_ACCOUNT_ID (zmienna) w GitHub Actions."
            exit 1
          fi
          npx --yes wrangler@4.166.0 pages deploy pages --project-name grubasek --branch main --commit-hash "$GITHUB_SHA"
