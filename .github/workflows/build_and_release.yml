name: Build & Release Grubasek (Android APK & Web PWA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Kompilacja pliku APK (Android)
    runs-on: ubuntu-latest

    steps:
      - name: Pobieranie kodu z repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Java (OpenJDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Konfiguracja Flutter SDK (3.24.5)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Pobieranie zależności projektu
        run: flutter pub get

      - name: Uruchomienie testów jednostkowych
        run: flutter test

      - name: Budowanie zoptymalizowanych plików Android APK (Split ABI - ~24 MB)
        id: android
        run: |
          flutter build apk --release --split-per-abi
          awk '$1 == "version:" { split($2, parts, /[+]/); print "version=" parts[1]; exit }' pubspec.yaml >> "$GITHUB_OUTPUT"
          ls -lh build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/grubasek.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/grubasek-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/grubasek-armeabi-v7a.apk

      - name: Zapisanie pliku instalacyjnego APK jako Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: grubasek-android-apk
          path: build/app/outputs/flutter-apk/grubasek.apk
          retention-days: 30

      - name: Publikacja automatycznego Release w GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Grubasek ${{ steps.android.outputs.version }} (Android APK)"
          body: |
            Automatyczna kompilacja najnowszej wersji aplikacji Grubasek (Split ABI).
            - `grubasek.apk`: Zoptymalizowana wersja na telefony z Androidem (ARM64, ~24 MB - 3x szybsze pobieranie!).
            - `grubasek-armeabi-v7a.apk`: Wersja na starsze procesory 32-bitowe (~22 MB).
          files: |
            build/app/outputs/flutter-apk/grubasek.apk
            build/app/outputs/flutter-apk/grubasek-arm64-v8a.apk
            build/app/outputs/flutter-apk/grubasek-armeabi-v7a.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rejestracja wydania w Supabase (opcjonalnie)
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        shell: bash
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          DOWNLOAD_URL: "https://github.com/${{ github.repository }}/releases/download/latest/grubasek.apk"
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::notice::Pominięto aktualizację tabeli app_releases w Supabase. Ustaw sekret SUPABASE_SERVICE_ROLE_KEY w GitHub Secrets, aby automatycznie publikować powiadomienia OTA o nowej wersji Android APK."
            exit 0
          fi

          SUPABASE_URL="${SUPABASE_URL:-https://wyrgagwstoscxhstyzmf.supabase.co}"
          VERSION_RAW=$(awk '$1 == "version:" { print $2; exit }' pubspec.yaml | tr -d "\"'")
          VERSION_NAME="${VERSION_RAW%%+*}"
          if [[ "$VERSION_RAW" == *"+"* ]]; then
            VERSION_CODE="${VERSION_RAW#*+}"
          else
            VERSION_CODE="1"
          fi

          if [ -z "$VERSION_NAME" ] || ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::Nie udało się odczytać poprawnej wersji z pubspec.yaml ($VERSION_RAW)."
            exit 1
          fi

          PUBLISHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          PAYLOAD=$(jq -n \
            --arg platform "android" \
            --arg version_name "$VERSION_NAME" \
            --argjson version_code "$VERSION_CODE" \
            --arg download_url "$DOWNLOAD_URL" \
            --arg changelog "Automatyczna kompilacja Android APK (${VERSION_NAME}+${VERSION_CODE})" \
            --arg published_at "$PUBLISHED_AT" \
            '{
              platform: $platform,
              version_name: $version_name,
              version_code: $version_code,
              download_url: $download_url,
              changelog: $changelog,
              is_mandatory: false,
              is_active: true,
              published_at: $published_at
            }')

          AUTH_HEADERS=(
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY"
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"
            -H "Content-Type: application/json"
          )

          RESPONSE=$(curl -sS -w "\n%{http_code}" -X PATCH \
            "${SUPABASE_URL}/rest/v1/app_releases?platform=eq.android&version_code=eq.${VERSION_CODE}" \
            "${AUTH_HEADERS[@]}" \
            -H "Prefer: return=representation" \
            -d "$PAYLOAD")
          HTTP_CODE=$(printf '%s\n' "$RESPONSE" | tail -n1)
          BODY=$(printf '%s\n' "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Błąd aktualizacji app_releases w Supabase (HTTP $HTTP_CODE): $BODY"
            exit 1
          fi

          if [ "$BODY" = "[]" ] || [ -z "$BODY" ]; then
            INSERT_RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST \
              "${SUPABASE_URL}/rest/v1/app_releases" \
              "${AUTH_HEADERS[@]}" \
              -H "Prefer: return=representation" \
              -d "$PAYLOAD")
            INSERT_CODE=$(printf '%s\n' "$INSERT_RESPONSE" | tail -n1)
            INSERT_BODY=$(printf '%s\n' "$INSERT_RESPONSE" | sed '$d')

            if [ "$INSERT_CODE" -lt 200 ] || [ "$INSERT_CODE" -ge 300 ]; then
              echo "::error::Błąd dodawania rekordu do app_releases w Supabase (HTTP $INSERT_CODE): $INSERT_BODY"
              exit 1
            fi
            echo "Dodano nowe wydanie Android ${VERSION_NAME}+${VERSION_CODE} do Supabase app_releases."
          else
            echo "Zaktualizowano istniejące wydanie Android ${VERSION_NAME}+${VERSION_CODE} w Supabase app_releases."
          fi

  build-web:
    name: Kompilacja wersji Web (PWA)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Pobieranie kodu z repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Flutter SDK (3.24.5)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Pobieranie zależności projektu
        run: flutter pub get

      - name: Budowanie wersji Web (PWA Release)
        run: flutter build web --release --base-href /app/ --web-renderer canvaskit --pwa-strategy none

      - name: Zapisanie wersji Web jako Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: grubasek-web-pwa
          path: build/web
          retention-days: 14

      - name: Przygotowanie strony i aplikacji dla Cloudflare Pages
        if: github.ref == 'refs/heads/main'
        run: node deploy/build-pages.mjs build/web build/pages "$GITHUB_SHA"

      - name: Zapisanie paczki Cloudflare Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: grubasek-pages
          path: build/pages
          if-no-files-found: error
          retention-days: 7

  deploy-web:
    name: Publikacja na grubasek.pages.dev
    needs: build-web
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: grubasek-pages-production
      cancel-in-progress: false
    steps:
      - name: Sprawdzenie aktualności wersji
        id: revision
        shell: bash
        run: |
          latest=$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" refs/heads/main | cut -f1)
          test -n "$latest"
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Na main jest już nowszy commit. Pomijam tę publikację."
          fi

      - name: Pobranie gotowej strony
        if: steps.revision.outputs.deploy == 'true'
        uses: actions/download-artifact@v4
        with:
          name: grubasek-pages
          path: pages

      - name: Konfiguracja Node.js
        if: steps.revision.outputs.deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wdrożenie na Cloudflare Pages
        if: steps.revision.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Ustaw CLOUDFLARE_API_TOKEN (sekret) i CLOUDFLARE_ACCOUNT_ID (zmienna) w GitHub Actions."
            exit 1
          fi
          npx --yes wrangler@4.166.0 pages deploy pages --project-name grubasek --branch main --commit-hash "$GITHUB_SHA"
