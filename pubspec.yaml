name: grubasek
description: "A comprehensive, offline-first calorie and macro tracking mobile application modeled after Fitatu."
publish_to: 'none'
version: 1.0.6+7

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Local Database (Offline-first)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Barcode Scanner
  mobile_scanner: ^6.0.4

  # Networking & HTTP
  dio: ^5.7.0
  supabase_flutter: ^2.8.0

  # Data Visualization
  fl_chart: 0.68.0

  # File Sharing & Export
  share_plus: ^10.1.3
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3

  # Utilities
  intl: '>=0.19.0 <1.0.0'
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.1
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
